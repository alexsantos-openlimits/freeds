;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; build_cache_dir foi desativado de propósito: a cache guarda também o
; firmware.elf/firmware.bin finais e, depois de alterar código, o PlatformIO
; escrevia "Retrieved firmware.elf from cache" e reaproveitava o binário
; antigo. Além de poder gravar firmware desatualizado, quando o alvo vem da
; cache o SCons não corre a pós-ação de pio/name-firmware.py, pelo que não
; aparecia nenhum ficheiro novo em build_output/. Compilar do zero demora
; mais alguns segundos, mas o que é gravado é sempre o código atual.
; build_cache_dir = .cache

[env:heltec_wifi_kit_32]
platform = espressif32 @ ~3.5.0
board = heltec_wifi_kit_32
framework = arduino
;upload_port = COM[4]
;upload_port = /dev/cu.SLAB_USBtoUART
monitor_speed = 115200
;monitor_port = COM[4]
extra_scripts = pio/name-firmware.py
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
build_flags = ;-Wl,-Map,output.map
              -DCORE_DEBUG_LEVEL=5
              -DPIO_FRAMEWORK_ESP_IDF_ENABLE_EXCEPTIONS
              -DCONFIG_FREERTOS_ASSERT_DISABLE
              -DCONFIG_LWIP_ESP_GRATUITOUS_ARP
              -DCONFIG_LWIP_GARP_TMR_INTERVAL=30
              
              ; -g -DDEBUG_FAUXMO=Serial -DDEBUG_FAUXMO_VERBOSE_TCP=1 -DDEBUG_FAUXMO_VERBOSE_UDP=1

#libraries
lib_deps =
            bblanchon/ArduinoJson@^6.21.5
