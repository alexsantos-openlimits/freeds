<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="FreeDS - Derivador de energia solar excedente">
<title>FreeDS</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>
        </svg>
      </span>
      <div class="brand-text">
        <strong data-i18n="app.title"></strong>
        <span data-i18n="app.subtitle"></span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main"></nav>
    <div class="sidebar-footer">
      <div id="uptime-footer"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" data-i18n-aria-label="common.menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <h1 id="page-title">FreeDS</h1>
      <div class="topbar-spacer"></div>
      <div class="lang-switch" id="lang-switch">
        <button type="button" data-lang="pt">PT</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div class="status-pill" id="wifi-pill"><span class="dot"></span><span data-role="text">Wi-Fi</span></div>
      <div class="status-pill" id="source-pill"><span class="dot"></span><span data-role="text">—</span></div>
    </header>

    <main class="view" id="view-root">
      <div class="empty-note" data-i18n="common.loading"></div>
    </main>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
